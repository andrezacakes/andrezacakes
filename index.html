<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Andreza Cakes</title>

<style>
body{font-family:Arial;background:#f9eef3;margin:0}

/* Modal */
#cartModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* BOX */
.box{
  width:400px;
  background:#fff;
  border-radius:25px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  max-height:90vh;
}

/* SCROLL AREA */
#cartScroll{
  flex:1;
  overflow-y:auto;
  padding:10px;
  scroll-behavior:smooth;
}

/* iPhone style scrollbar */
#cartScroll{
  scrollbar-width:thin;
  scrollbar-color:#d96491 transparent;
}

#cartScroll::-webkit-scrollbar{
  width:6px;
}
#cartScroll::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#ff8db4,#d96491);
  border-radius:999px;
}
#cartScroll::-webkit-scrollbar-track{
  background:transparent;
}

/* Item */
.item{
  background:#fff5f8;
  padding:10px;
  border-radius:15px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div id="cartModal">
  <div class="box">

    <div style="padding:15px;font-weight:bold;">Finalizar pedido</div>

    <div id="cartScroll">
      <div class="item">Item 1</div><div class="item">Item 2</div><div class="item">Item 3</div><div class="item">Item 4</div><div class="item">Item 5</div><div class="item">Item 6</div><div class="item">Item 7</div><div class="item">Item 8</div><div class="item">Item 9</div><div class="item">Item 10</div><div class="item">Item 11</div><div class="item">Item 12</div><div class="item">Item 13</div><div class="item">Item 14</div><div class="item">Item 15</div><div class="item">Item 16</div><div class="item">Item 17</div><div class="item">Item 18</div><div class="item">Item 19</div><div class="item">Item 20</div><div class="item">Item 21</div><div class="item">Item 22</div><div class="item">Item 23</div><div class="item">Item 24</div>
      <input placeholder="Nome" style="width:100%;padding:10px;margin-top:10px">
    </div>

  </div>
</div>

</body>
</html>
