<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andreza Cakes</title>
<style>
body{font-family:Arial;margin:0;background:#fff5f7}
header{background:#fff;padding:20px;display:flex;justify-content:space-between}
h1{color:#d63384}
.card{background:#fff;margin:15px;padding:15px;border-radius:15px}
button{background:#ff4d88;color:#fff;border:none;padding:10px;border-radius:10px}
</style>
</head>
<body>

<header>
<h1>Andreza Cakes</h1>
</header>

<div class="card">
<h3>Bolo por KG</h3>
<select id="massa">
<option>Branca</option>
<option>Chocolate</option>
<option>Red Velvet (+R$10/kg)</option>
</select>
<input type="number" id="kg" placeholder="KG">
<button onclick="addBolo()">Adicionar</button>
</div>

<script>
let total=0;
function addBolo(){
 let kg=document.getElementById("kg").value;
 let massa=document.getElementById("massa").value;
 let preco=kg*90;
 if(massa.includes("Red Velvet")){
   preco+=kg*10;
 }
 total+=preco;
 alert("Total: R$ "+total);
}
</script>

</body>
</html>
